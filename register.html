<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Page - Fumart</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="background-wrapper">
      <a href="login.html" class="top-action-btn">LOGIN</a>

      <div class="auth-card">
        <div class="card-left-image">
          <img src="Rectangle14.png" alt="Shopping Cart and Boxes" />
        </div>

        <div class="card-right-form">
          <h1 class="form-title">Registration</h1>

          <form>
            <div class="input-group">
              <label for="firstName">FIRST NAME</label>
              <input type="text" id="firstName" placeholder="John" />
            </div>

            <div class="input-group">
              <label for="email">EMAIL ADRESS</label>
              <input
                type="email"
                id="email"
                placeholder="johndoe@example.com"
              />
            </div>

            <div class="input-group password-field">
              <label for="password">PASSWORD</label>
              <input type="password" id="password" placeholder="**********" />
              <img src="image.png" alt="Show Password" class="toggle-icon" />
            </div>

            <div class="input-group password-field">
              <label for="confirmPassword">CONFIRM PASSWORD</label>
              <input
                type="password"
                id="confirmPassword"
                placeholder="**********"
              />
              <img src="image.png" alt="Show Password" class="toggle-icon" />
            </div>

            <div class="terms-agreement">
              <input type="checkbox" id="terms" checked />
              <label for="terms"
                >I agree to the Terms of Service and Privacy Policy.</label
              >
            </div>

            <button type="submit" class="submit-btn">CREATE AN ACCOUNT</button>

            <div class="or-divider">
              <span>OR</span>
            </div>

            <div class="social-login-icons">
              <a href="#"><img src="google.png" alt="Google" /></a>
              <a href="#"><img src="apple.png" alt="Apple" /></a>
              <a href="#"><img src="facebook.png" alt="Facebook" /></a>
            </div>
          </form>
        </div>
      </div>

      <footer class="site-footer">
        © 2021 - 2025 All Rights Reserved.Fumart
      </footer>
    </div>
  </body>
</html>
